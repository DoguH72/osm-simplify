[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osm-simplify"
version = "1.1.0"
description = "Lightweight, zero-dependency offline PBF spatial grid index and OSM search library."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Dogu Hatipoglu" }
]
keywords = [
    "openstreetmap",
    "overpass-api",
    "gis",
    "nominatim",
    "geocoding",
    "spatial-search",
    "osm"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: GIS",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests",
]

[project.urls]
"Homepage" = "https://github.com/DoguH72/osm-simplify"
"Repository" = "https://github.com/DoguH72/osm-simplify"
"Bug Tracker" = "https://github.com/DoguH72/osm-simplify/issues"
