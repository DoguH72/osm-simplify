name: Publish to PyPI with Build Provenance

on:
  release:
    types: [published]

jobs:
  pypi-publish:
    name: Build, Attest, and Upload to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write      
      contents: read       
      attestations: write  

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Generate Build Attestations (Provenance)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "dist/*"

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1